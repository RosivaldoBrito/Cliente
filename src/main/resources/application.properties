spring.application.name=cliente

server.servlet.context-path=/mrtech/v1
server.port=8081

# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_cliente
spring.datasource.username=${DB_USERS}
spring.datasource.password=${DB_PASSWORDS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

